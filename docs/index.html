<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121214" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NEF CRM">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Naked Eye Films CRM</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
html{height:100%}
[hidden]{display:none!important}

/* Layout: phone-first app shell (max 520px), bottom tab bar, slide-up sheets for details. */
:root{
  --bg:#f6f5f2; --surface:#ffffff; --surface2:#eeece7; --line:#dedbd3;
  --fg:#17161a; --muted:#6f6c66; --accent:#e4572e; --accent-fg:#ffffff;
  --good:#1f8a5a; --warn:#c7850a; --bad:#c62f2f; --info:#2f63c6;
  --good-bg:#e3f3ea; --warn-bg:#fbefd6; --bad-bg:#fbe3e3; --info-bg:#e3ebfb; --accent-bg:#fde7df;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"Archivo","Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --radius:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#121214; --surface:#1c1c20; --surface2:#26262b; --line:#33333a;
  --fg:#f1efe9; --muted:#9a978f; --accent:#ff6a3d; --accent-fg:#1a0d08;
  --good:#4fcf8b; --warn:#f0b24a; --bad:#ff6b6b; --info:#7aa2ff;
  --good-bg:#15301f; --warn-bg:#352a12; --bad-bg:#3a1a1a; --info-bg:#182544; --accent-bg:#3a1f16;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#121214; --surface:#1c1c20; --surface2:#26262b; --line:#33333a;
  --fg:#f1efe9; --muted:#9a978f; --accent:#ff6a3d; --accent-fg:#1a0d08;
  --good:#4fcf8b; --warn:#f0b24a; --bad:#ff6b6b; --info:#7aa2ff;
  --good-bg:#15301f; --warn-bg:#352a12; --bad-bg:#3a1a1a; --info-bg:#182544; --accent-bg:#3a1f16;
  color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;font-size:16px;min-height:44px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.btn,.tab,.tile,.row,nav.bottom button,.bell,.role,.seg button{min-height:44px;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.btn.sm{min-height:40px}
.row,.tile,.btn,.notif,.tab{transition:transform .12s ease,background .12s ease}
.row:active,.tile:active,.btn:active,.notif:active{transform:scale(.985)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

#app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--bg);position:relative}
@media (min-width:600px){#app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:14px 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--display);font-weight:800;font-stretch:90%;font-size:17px;letter-spacing:-.02em;flex:1;display:flex;align-items:center;gap:8px}
.brand .eye{width:22px;height:22px;border-radius:50%;background:var(--fg);display:inline-grid;place-items:center}
.brand .eye i{width:9px;height:9px;border-radius:50%;background:var(--accent);display:block}
.role{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:5px 10px;background:var(--surface);color:var(--muted)}
.bell{position:relative;width:38px;height:38px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center}
.bell b{position:absolute;top:-4px;right:-4px;background:var(--accent);color:var(--accent-fg);font-size:11px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px}

main{flex:1;padding:16px 16px 96px}
.screen[hidden]{display:none}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.h1{font-size:24px;font-weight:700;margin:2px 0 14px}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:22px 0 10px}
.sec h2{font-size:15px;font-weight:700}
.sec .more{font-size:13px;color:var(--accent);font-weight:600}

.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;text-align:left}
.tile .k{font-size:12px;color:var(--muted)}
.tile .v{font-size:26px;font-weight:700;line-height:1.1;margin-top:4px}
.tile .s{font-size:12px;color:var(--muted);margin-top:4px}
.tile.hot{border-color:var(--accent)}

.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;text-align:left;width:100%}
.row .av{width:38px;height:38px;border-radius:10px;background:var(--surface2);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.row .body{flex:1;min-width:0}
.row .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .m{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .r{flex:none;text-align:right;font-size:12px;color:var(--muted)}
.row.due{border-left:3px solid var(--warn)}
.row.late{border-left:3px solid var(--bad)}

.pill{display:inline-block;font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--surface2);color:var(--fg);letter-spacing:.01em;white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.info{background:var(--info-bg);color:var(--info)}
.pill.acc{background:var(--accent-bg);color:var(--accent)}

.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;font-size:13px;font-weight:600;padding:7px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.tab.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tab b{font-family:var(--mono);font-weight:600;margin-left:4px;opacity:.7}

/* stage stepper */
.stepper{display:grid;grid-template-columns:repeat(var(--n,4),1fr);gap:4px;margin:10px 0 4px}
.stepper span{height:5px;border-radius:3px;background:var(--line)}
.stepper span.done{background:var(--good)}
.stepper span.cur{background:var(--accent)}
.steplabels{display:grid;grid-template-columns:repeat(var(--n,4),1fr);gap:4px;font-size:10px;color:var(--muted);text-align:center}

/* bottom nav */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;pointer-events:none}
nav.bottom .bar{pointer-events:auto;width:100%;max-width:520px;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav.bottom button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--muted);padding:6px 2px;border-radius:10px}
nav.bottom button.on{color:var(--accent)}
nav.bottom svg{width:22px;height:22px}
.fab{position:fixed;right:calc(50% - 260px + 16px);bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:6;width:54px;height:54px;border-radius:50%;background:var(--accent);color:var(--accent-fg);box-shadow:0 8px 24px rgba(0,0,0,.25);display:grid;place-items:center;font-size:30px;font-weight:300;line-height:1}
@media (max-width:600px){.fab{right:16px}}

/* sheets */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;max-height:92%;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:10px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sheet-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}
.sheet-head h2{font-size:20px;flex:1}
.x{width:34px;height:34px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-size:18px;flex:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.card + .card{margin-top:10px}
.card h3{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:10px;text-transform:uppercase;letter-spacing:.06em}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px}
.kv .k{color:var(--muted)}
.kv .v{text-align:right;font-weight:600}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{padding:10px 14px;border-radius:10px;font-weight:600;font-size:14px;background:var(--surface2);border:1px solid var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:12.5px}
.btn.good{background:var(--good-bg);color:var(--good);border-color:transparent}
.btn.full{width:100%;text-align:center}
.timeline{display:flex;flex-direction:column;gap:0;margin-top:4px}
.tl{display:grid;grid-template-columns:18px 1fr;gap:10px;padding:6px 0;font-size:13.5px}
.tl i{width:10px;height:10px;border-radius:50%;background:var(--line);margin-top:6px;justify-self:center}
.tl.done i{background:var(--good)}
.tl.cur i{background:var(--accent);box-shadow:0 0 0 4px var(--accent-bg)}
.tl .d{color:var(--muted);font-size:12px}
.field{margin-bottom:10px}
.field label{display:block;font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--surface2);padding:4px;border-radius:10px}
.seg button{padding:8px 4px;border-radius:7px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.check{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.check:first-of-type{border-top:0}
.check .box{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.check.done .box{background:var(--good);border-color:var(--good);color:#fff}
.check .who{margin-left:auto;font-size:11px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13.5px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:90%;text-align:center}
.notif{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.notif:first-child{border-top:0}
.notif .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;font-size:15px;background:var(--surface2)}
.notif .ic.warn{background:var(--warn-bg)} .notif .ic.good{background:var(--good-bg)} .notif .ic.info{background:var(--info-bg)} .notif .ic.bad{background:var(--bad-bg)}
.notif .t{font-weight:600;font-size:14px}
.notif .m{font-size:12.5px;color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:6px;height:90px;margin-top:8px}
.bars div{flex:1;background:var(--surface2);border-radius:4px 4px 0 0;position:relative;min-height:4px}
.bars div.paid{background:var(--good)}
.bars div.cur{background:var(--accent)}
.bars div span{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:10px;color:var(--muted)}
.empty{color:var(--muted);font-size:13.5px;padding:18px;text-align:center;border:1px dashed var(--line);border-radius:var(--radius)}
.note{font-size:12.5px;color:var(--muted);background:var(--surface2);padding:8px 10px;border-radius:8px;margin-top:10px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}}
.sheet{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.fields .field{grid-column:1/-1}
.fields .field.half{grid-column:auto}
.field label .opt{font-weight:500;opacity:.6;font-size:11px;margin-left:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:38px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
textarea.prompt{font-family:var(--mono);font-size:12px;line-height:1.5;min-height:300px;resize:vertical;background:var(--surface2)}
.briefcard{border-left:3px solid var(--accent)}
.other{margin-top:6px}
.srow{display:grid;grid-template-columns:64px 18px 1fr auto 34px;gap:6px;align-items:center;margin-top:6px}
.srow .pct{text-align:right;padding:8px 6px}.srow .pct[readonly]{background:var(--surface2);color:var(--muted)}
.srow .pctsign{color:var(--muted);font-size:13px}.srow .wdate{grid-column:1/-1}
.x.sm{width:34px;height:34px;font-size:16px}
input[type=date].btn{font-weight:500;min-height:40px}
.bgroup{margin-top:6px}.gtitle{font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin:14px 0 8px;display:flex;justify-content:space-between}.gcount{font-family:var(--mono);font-weight:500;letter-spacing:0;text-transform:none}
.jump{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding:6px 0 10px;scrollbar-width:none;align-items:center}.jump::-webkit-scrollbar{display:none}.jump .chip{flex:none;min-height:34px;padding:5px 11px}.jcount{flex:none;margin-left:auto;font-size:12px;color:var(--muted);font-family:var(--mono);padding-left:8px}
.sticky-actions{position:sticky;bottom:calc(-24px - env(safe-area-inset-bottom,0px));background:var(--bg);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));margin-top:12px;display:flex;gap:8px;border-top:1px solid var(--line)}.sticky-actions .btn.primary{flex:1}
.wa{font-size:15px;line-height:1.5;min-height:160px;resize:vertical}
a.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.tel{color:inherit;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.search{margin-bottom:10px}.search input{min-height:44px;border-radius:12px;background:var(--surface)}
.login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px 16px}.login-box{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px 22px}
.install{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:7;background:var(--fg);color:var(--bg);padding:8px 10px 8px 14px;border-radius:14px;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.3)}.install .x{background:transparent;color:inherit}
.field[data-locked]{opacity:.45}.field[data-locked] input{pointer-events:none;background:var(--surface2)}
.custompay{background:var(--surface2);padding:10px 12px;border-radius:10px}
.eyebrow.live{color:var(--bad);display:flex;align-items:center;gap:6px}
.eyebrow.live i{width:8px;height:8px;border-radius:50%;background:var(--bad);display:inline-block;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.discard{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--warn-bg);color:var(--fg);padding:10px 12px;border-radius:10px;margin-bottom:12px;font-size:13.5px;font-weight:600}
.discard span{flex:1}
body.locked{overflow:hidden}

/* Small phones */
@media (max-width:360px){.tile .v{font-size:22px}.h1{font-size:21px}.grid2{grid-template-columns:1fr}}

/* Desktop / tablet landscape: side navigation, wider content, centered modal sheets */
@media (min-width:900px){
  #app{max-width:1060px;padding-left:212px;border:0}
  header.top{padding:18px 28px 12px}
  main{padding:24px 28px 60px;max-width:760px}
  nav.bottom{left:auto;right:auto;bottom:auto;top:0;width:212px;position:fixed;left:calc(50% - 530px);height:100%}
  nav.bottom .bar{display:flex;flex-direction:column;gap:4px;height:100%;border-top:0;border-right:1px solid var(--line);padding:22px 12px;max-width:none}
  nav.bottom button{flex-direction:row;justify-content:flex-start;gap:12px;font-size:14.5px;padding:11px 12px;border-radius:10px}
  nav.bottom button.on{background:var(--accent-bg)}
  nav.bottom .bar::before{content:"Naked Eye Films";font-family:var(--display);font-weight:800;font-size:16px;letter-spacing:-.02em;padding:4px 12px 18px}
  .fab{right:auto;left:calc(50% + 530px - 80px);bottom:32px}
  .tiles{grid-template-columns:repeat(4,1fr)}
  .sheet-bg{align-items:center}
  .sheet{max-width:600px;max-height:88vh;border-radius:20px;padding:12px 24px 24px}
  .sheet .grab{display:none}
}
@media (min-width:900px) and (max-width:1100px){nav.bottom{left:0}#app{margin-left:0}.fab{left:auto;right:24px}}
</style>
</head>
<body>

<div id="login" class="login" hidden>
  <div class="login-box">
    <div class="brand" style="justify-content:center;font-size:22px;margin-bottom:6px"><span class="eye"><i></i></span>Naked Eye Films</div>
    <div style="text-align:center;color:var(--muted);font-size:13.5px;margin-bottom:22px">Clients, shoots, payments and jobs — in one place.</div>
    <form id="loginForm">
      <div class="field"><label>Email</label><input id="lEmail" type="email" autocomplete="username" inputmode="email" required placeholder="you@nakedeyefilms.co"></div>
      <div class="field"><label>Password</label><input id="lPass" type="password" autocomplete="current-password" required></div>
      <div id="loginErr" class="note" style="color:var(--bad);background:var(--bad-bg)" hidden></div>
      <div class="btns"><button class="btn primary full" id="loginBtn" type="submit">Sign in</button></div>
    </form>
    <div class="note" style="text-align:center">You stay signed in on this phone. Ask Hussein for your login.</div>
  </div>
</div>
<div id="app" hidden>
  <header class="top">
    <div class="brand"><span class="eye"><i></i></span>Naked Eye Films</div>
    <button class="role" id="roleBtn" title="Switch role">Owner ▾</button>
    <button class="bell" id="bellBtn" aria-label="Notifications">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
      <b id="bellCount">0</b>
    </button>
  </header>
  <main id="main"></main>
  <button class="fab" id="fab" aria-label="Add client">+</button>
  <nav class="bottom"><div class="bar" id="nav"></div></nav>
</div>
<div id="installBar" class="install" hidden><span id="installTxt">Add this app to your home screen</span><button class="btn sm primary" id="installBtn" data-install>Install</button><button class="x sm" data-install-close aria-label="Dismiss">×</button></div>
<div id="sheetRoot"></div>
<div id="toastRoot"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>

function recalcSchedule(){
  const rows=[...document.querySelectorAll('#schedRows .srow')]; if(!rows.length) return;
  const others=rows.slice(0,-1).reduce((s,r)=>s+(+r.querySelector('.pct').value||0),0);

function readBrief(){
  const b={};
  BRIEF.forEach(f=>{
    const el=document.getElementById('b_'+f.k); if(!el) return;
    if(f.t==='chips') b[f.k]=[...el.querySelectorAll('.chip.on')].map(x=>x.dataset.chip);
    else if(f.t==='seg') b[f.k]=el.querySelector('.on')?.dataset.segv||'';
    else if(f.t==='select'){ const o=document.getElementById('b_'+f.k+'_other'); b[f.k]= el.value==='Other' ? ('Other'+(o&&o.value.trim()?': '+o.value.trim():'')) : el.value; }
    else b[f.k]=el.value.trim();
  });
  if($('#schedRows')){ b.schedule=readSchedule(); b.deposit=b.schedule[0]?.pct||''; }
  ['contact','business','phone','email'].forEach(k=>{ const el=document.getElementById('b_'+k); if(el) b[k]=el.value.trim(); });
  return b;
}
function updateBriefCount(){ const b=readBrief(); const n=BRIEF.filter(f=>f.k!=='deposit'&&f.k!=='extra').filter(f=>has(b[f.k])).length; const el=$('#briefCount'); if(el) el.textContent=`${n}/${BRIEF.length-2} answered`; document.querySelectorAll('.gcount').forEach(g=>{ const fs=BRIEF.filter(f=>f.g===g.dataset.g&&f.k!=='deposit'); const k=fs.filter(f=>has(b[f.k])).length; g.textContent = fs.length>1? `${k}/${fs.length}`:''; }); }

function proposalPrompt(c){

  const deliv = v(b.deliverables);
  return `You are writing a client proposal for Naked Eye Films (NEF), a video production agency in Beirut, Lebanon. Tagline: "Each Frame Tells a Human Tale". Prepared by Hussein Zayatt — Naked Eye Films, contact Hussein@nakedeyefilms.co. Write in clear, confident, friendly English.

function applyBrief(c){

  c.pkg = match? match[0] : 'custom'; if(c.pkg==='custom') c.customPrice = price||0;
  c.payPlan = b.payTerms==='Full upfront'?'100': b.payTerms==='50 / 50'?'50': has(b.deposit)? String(+b.deposit) : (c.payPlan||'50');

}

document.addEventListener('submit', e=>{
  e.preventDefault();
  if(e.target.id==='addForm'){
    const disc=$('#f_disc').value; const c={id:Date.now(),name:$('#f_name').value,contact:$('#f_contact').value||'—',phone:$('#f_phone').value||'—',email:$('#f_email').value.trim(),type:'lead',stage:disc?1:0,created:TODAY_ISO,followUp:disc?disc.slice(0,10):plusDays(TODAY_ISO,1),discovery:disc||null,notes:($('#f_src').value)+(($('#f_notes').value)?' · '+$('#f_notes').value:''),pkg:null,log:[[TODAY_ISO,'Added as new lead ('+$('#f_src').value+')']]};

    state.clients.unshift(c); state.screen='leads'; state.leadTab='all'; closeSheet(); render(); toast(c.name+' added to pipeline'); clientSheet(c.id);
  }
  if(e.target.id==='briefForm'){
    const c=byId(+e.target.dataset.cid); const first=!c.brief; const live=e.target.dataset.live==='1'; const dur=$('#callTimer')?.textContent; c.brief=readBrief(); delete c.briefDraft; applyBrief(c);
    if(first || !c.briefDate) c.briefDate=TODAY_ISO;
    if(!c.discovery) c.discovery='2026-10-13T'+new Date().toTimeString().slice(0,5); // call happened now
    if(c.briefDate < c.discovery.slice(0,10)) c.briefDate=c.discovery.slice(0,10); // proposal never dated before the call
    if(c.brief.editing==='Raw footage only') c.brief.revisions='';
    if(c.brief.business) c.name=c.brief.business; if(c.brief.contact) c.contact=c.brief.contact; if(c.brief.phone) c.phone=c.brief.phone; c.email=c.brief.email||'';
    c.log.unshift([TODAY_ISO, first?(live?'Discovery call ended ('+dur+') · brief saved':'Brief saved'):'Brief updated']);
    if(first && c.stage===1){ c.followUp=plusDays(TODAY_ISO,1); }
    render(); promptSheet(c.id); toast(first?'Brief saved · prompt ready':'Brief updated');
  }
  if(e.target.id==='editForm'){
    const c=byId(+e.target.dataset.cid); c.cycle=2; c.driveRaw=$('#e_raw').value.trim()||c.driveRaw; c.teamNotes=$('#e_notes').value.trim();

    closeSheet(); toast(FEEDBACK_PHONE?'Opening WhatsApp':'Feedback copied — paste it in WhatsApp'); return;
  }
  if(e.target.id==='doneForm'){
    const c=byId(+e.target.dataset.cid); const j=c.jobs.find(x=>x.id===e.target.dataset.jid); j.done=true; j.when=TODAY_ISO; j.note=$('#d_note').value.trim(); j.link=$('#d_link').value.trim();
    const lbl=j.kind==='edit'?'Edits ready':'Posted'; c.log.unshift([TODAY_ISO,j.who+' · '+lbl+': '+j.title+(j.note?' · '+j.note:'')]);
    if(j.link && j.kind==='edit') c.driveEdited=j.link;
    if(j.kind==='edit' && c.cycle<2) c.cycle=2;
    if(j.kind==='edit' && c.jobs.filter(x=>x.kind==='edit').every(x=>x.done) && !c.jobs.some(x=>x.kind==='post')){ const pj={id:'j'+Date.now(),title:'Post '+(c.brief?.deliverables||'this month\'s content'),kind:'post',who:nameFor('social'),done:false}; c.jobs.push(pj); c.log.unshift([TODAY_ISO,'Edits complete · posting job created for Lina']); notify('📱','info','New posting job for '+nameFor('social'),c.name+' · '+pj.title,c.id,'social'); }
    if(j.kind==='post' && c.jobs.filter(x=>x.kind==='post').every(x=>x.done)) c.cycle=3;
    closeSheet(); notify(j.kind==='edit'?'✂️':'📱','good',j.who+' · '+lbl+': '+j.title,c.name+(j.note?' · '+j.note:''),c.id);
  }

  if(s.dataset.setdrive){ const c=byId(+s.dataset.cid); const k=s.dataset.setdrive; c[k]=s.value.trim(); const lbl=k==='driveRaw'?'Raw footage':'Edited footage'; if(c[k]){ c.log.unshift([TODAY_ISO,lbl+' link added by '+roleName()]); if(state.role!=='owner') notify('📁','info',roleName()+' added '+lbl.toLowerCase()+' link',c.name,c.id); } toast(c[k]?lbl+' link saved':lbl+' link removed'); render(); state.role==='owner'? clientSheet(c.id) : teamClientSheet(c.id); return; }
  if(s.dataset.fu){ const c=byId(+s.dataset.fu); if(s.value){ c.followUp=s.value; toast('Follow-up set for '+fmtD(s.value)); render(); } return; }
  if(s.closest('#briefForm')) saveDraft();
});
// remember which client a job sheet belongs to
const _addJobSheet=addJobSheet; addJobSheet=function(cid){ state._jobClient=byId(cid); _addJobSheet(cid); };
const _render=render; render=function(){ if(!state.loaded) return; _render(); persist(); };
// PWA: service worker + install hint
if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
let deferredInstall=null; window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); deferredInstall=e; const b=$('#installBar'); if(b) b.hidden=false; });
document.addEventListener('click',e=>{ const t=e.target.closest('[data-install],[data-install-close]'); if(!t) return; if(t.dataset.install!==undefined && deferredInstall){ deferredInstall.prompt(); deferredInstall=null; } $('#installBar').hidden=true; });
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream; const standalone=window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
window.addEventListener('load',()=>{ if(isIOS && !standalone){ const b=$('#installBar'); if(b){ b.hidden=false; $('#installTxt').textContent='Install: tap Share ⎙ then “Add to Home Screen”'; $('#installBtn').hidden=true; } } });
let sbUser=null;
function showLogin(msg){ $('#login').hidden=false; $('#app').hidden=true; $('#loginErr').textContent=msg||''; $('#loginErr').hidden=!msg; }
async function boot(session){
  if(!session){ showLogin(); return; }
  sbUser=session.user;
  const {data:prof,error}=await sb.from('crm_profiles').select('user_id,name,role').eq('user_id',sbUser.id).maybeSingle();
  if(error||!prof){ await sb.auth.signOut(); showLogin('This account has no role in the CRM. Ask the owner.'); return; }
  state.me=prof; state.role=prof.role; restore(); await loadAll(); subscribe();
  $('#login').hidden=true; $('#app').hidden=false; render();
  if(state.role==='owner' && !state.clients.length) toast('Empty for now — add a client with + or load demo clients from your name menu');
}
document.getElementById('loginForm').addEventListener('submit', async e=>{
  e.preventDefault(); const b=$('#loginBtn'); b.disabled=true; b.textContent='Signing in…';
  const {data,error}=await sb.auth.signInWithPassword({email:$('#lEmail').value.trim(),password:$('#lPass').value});
  b.disabled=false; b.textContent='Sign in';
  if(error){ showLogin('Wrong email or password.'); return; }
  boot(data.session);
});
sb.auth.getSession().then(({data})=>boot(data.session));
sb.auth.onAuthStateChange((ev,session)=>{ if(ev==='SIGNED_OUT'){ showLogin(); } });
</script>
